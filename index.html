<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
<div class="header">
    <h1> Gerenciador de senha</h1>
</div>

<div class="display-box">
    <span id="passaword">Senha</span>
    <button class="copy-btn" id="copyBtn" title="Copiar">Copiar</button>
</div>

<div class="custom-section">
    <h2>Personalize sua senha</h2>

    <div class="control-group">
        <span class="control-label"> Numero de caracteres</span>
    </div>
    <div class="counter">
        <button id="decrement">-</button>
        <span id="lengthVal">12</span>
        <button id="increment">+</button>
    </div>
</div>
<button class="generate-btn" id="generate-btn"> Gerar nova senha</button>
</div>
</div>

</body>
</html>
